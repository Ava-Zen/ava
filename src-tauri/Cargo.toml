[package]
name = "app"
version = "0.1.0"
description = "Ava — the conscious voice companion"
authors = ["Ava-Zen"]
license = "MIT OR Apache-2.0"
repository = ""
edition = "2021"
rust-version = "1.94.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tiny_http = "0.12"
llama-cpp-2 = { version = "0.1", optional = true }
encoding_rs = { version = "0.8", optional = true }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
github-copilot-sdk = "1.0"
tokio = { version = "1", features = ["macros", "time", "sync"] }
rfd = "0.15"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[features]
# Embedded llama.cpp inference engine (GGUF models). Off by default so plain
# builds don't require the native toolchain (CMake + C/C++ compiler).
native-llm = ["dep:llama-cpp-2", "dep:encoding_rs"]
# GPU-accelerated variants — enable the one matching the target platform:
native-llm-cuda = ["native-llm", "llama-cpp-2/cuda"]
native-llm-vulkan = ["native-llm", "llama-cpp-2/vulkan"]
native-llm-metal = ["native-llm", "llama-cpp-2/metal"]
