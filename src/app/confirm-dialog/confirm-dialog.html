@if (open() && request(); as prompt) {
  <div
    class="confirm-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="confirm-title"
    aria-describedby="confirm-message"
    (click)="onBackdrop()"
  >
    <div class="confirm-card" (click)="$event.stopPropagation()">
      <h2 id="confirm-title">{{ prompt.title }}</h2>
      <p id="confirm-message" class="lead">{{ prompt.message }}</p>
      <div class="actions">
        <button class="ghost-btn" type="button" autofocus (click)="onCancel()">
          {{ prompt.cancelLabel }}
        </button>
        <button
          class="save-btn"
          type="button"
          [class.danger]="prompt.danger"
          (click)="onConfirm()"
        >
          {{ prompt.confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
