<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ava</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Ava — the conscious voice companion. Speak. Feel. Evolve." />
    <meta name="theme-color" content="#f3ddd0" />
    <script>
      (function () {
        try {
          var preference = localStorage.getItem('ava-theme') || 'auto';
          var dark =
            preference === 'dark' ||
            (preference !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#1a100e' : '#f3ddd0');
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,650&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="ava-mark.svg" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
